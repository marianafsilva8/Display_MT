<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de @media</title>

    <style>
/* Base style for mobile devices */
body {
    padding: 20px;
    background-color: palevioletred;
    color: white;
    font-family: Arial, sans-serif;
}

h1{
    text-align: center;
    margin-bottom: 20px;
}

.container{
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.box{
    width: 100%;
    max-width: 400px;
    height: 200px;
    background-color: black;
}

/* For devices with a minimum width of 768px (Medium) */
@media screen and (min-width: 768px) {
  body {
    background-color: lightblue;
    color: white;
  }
}

/* For devices with a minimum width of 992px (Large) */
@media screen and (min-width: 992px) {
  body {
    background-color: mediumpurple;
    color: black;
  }
}
    </style>

</head>
<body>
    <h1>Este é um teste de @media</h1>
    <!-- Criando o container / box -->
    <div class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </div>
</body>
</html>
